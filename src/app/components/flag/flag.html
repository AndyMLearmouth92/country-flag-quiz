<div class="card bg-base-100 min-w-3xl min-h-3xl shadow-sm flex place-content-center bg-slate-500">
  <h2 class="text-3xl">World Flag Challenge</h2>
  <figure class="mt-8">
    <img [src]="quizFlagImage()" alt="Shoes" class="border-2 rounded-lg" />
  </figure>
  <div class="card-body">
    <div class="flex items-center gap-2">
      <label for="guessCountry" class="font-medium text-lg">Guess:</label>
      <input
        id="guessCountry"
        type="text"
        class="input text-gray-700"
        placeholder="Enter country"
        [value]="currentGuess()"
        (input)="currentGuess.set($event.target.value)"
      />
    </div>

    <h1>{{ correctCountry() }}</h1>
    <div class="flex flex-col gap-2">
      <h3 class="card-title">Wrong guesses:</h3>
      <ul class="flex justify-start">
        <li>USA</li>
      </ul>
    </div>
    <h3 class="card-title">Clues</h3>
    <p>
      A card component has a figure, a body part, and inside body there are title and actions parts
    </p>
    <div class="card-actions justify-end">
      <button class="btn btn-primary" (click)="submitGuess()">Submit guess</button>
    </div>
    <h3>Question {{ questionNumber() }} of 10</h3>
  </div>
</div>
